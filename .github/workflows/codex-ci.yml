name: codex-ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Test custom layout fallback
        run: npm run test:layout

      - name: Build
        run: npm run build
        env:
          CODEX_API_URL: https://thedarkestadvance-production.up.railway.app

      - name: Lint
        run: npm run lint
